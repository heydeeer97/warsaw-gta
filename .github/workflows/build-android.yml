
name: Build Warsaw GTA Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.3.0

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --path . \
            --export-debug "Android" \
            build/warsaw-gta.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Warsaw-GTA-APK
          path: build/warsaw-gta.apk
